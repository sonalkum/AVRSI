[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "avrsi"
version = "0.1.0"
description = "Recursively self-improving audio-visual reasoners with cross-modal checking"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "scipy", "pyyaml", "httpx"]

[project.optional-dependencies]
models = ["transformers", "peft", "av", "imageio-ffmpeg", "accelerate"]  # exact pins: requirements-qwen3.txt
test = ["pytest<9"]  # pytest 9.2 crashes at startup on Python 3.10.0

[tool.setuptools]
packages = ["avrsi", "avrsi.judges", "avrsi.data", "avrsi.models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
